<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Truck Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Truck Simulator</h1>
    <div class="hud" aria-live="off">
      <div class="stat main"><small>Pontos</small><b id="hScore">0</b></div>
      <div class="stat"><small>km/h</small><b id="hSpeed">0</b></div>
      <div class="stat"><small>Ultrapass.</small><b id="hPassed">0</b></div>
      <div class="stat"><small>Recorde</small><b id="hBest">0</b></div>
    </div>
  </header>

  <div class="wrap" id="wrap">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Pista do jogo Truck Simulator"></canvas>
      <div class="overlay" id="ovStart">
        <h2>Truck Simulator</h2>
        <p>Ultrapasse os caminhões sem encostar em nenhum. Quanto mais tempo na pista, mais pontos.</p>
        <p class="keys">Setas ou A / D para desviar.<br>No celular, toque no lado esquerdo ou direito.</p>
        <button id="btnStart" type="button">Começar</button>
      </div>
      <div class="overlay" id="ovOver" hidden>
        <h2 class="crash">Você bateu!</h2>
        <div class="final"><small>Pontuação</small><span id="fScore">0</span></div>
        <p id="fInfo"></p>
        <button id="btnRestart" type="button">Jogar de novo</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
